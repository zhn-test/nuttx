name: MemBrowse Memory Report

on:
  pull_request:
  push:
    branches:
      - master
      - "releases/*"

# pull-requests read: the dependency step re-reads the PR description so that a
# manual re-run picks up Depends-On lines edited after the run was created.
permissions:
  contents: read
  pull-requests: read

# Per-PR group so superseded PR pushes cancel; per-SHA on push so master
# commits never share a group. A shared refs/heads/master group lets a burst
# of pushes evict each other while pending (GitHub keeps only one pending run
# per group), leaving a commit with no report and breaking the MemBrowse
# parent chain for every commit that bases on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether any source files (i.e. non-doc/CODEOWNERS) changed.
  # When only docs/CODEOWNERS change we skip the build and post an "identical"
  # MemBrowse report instead.
  changes-filter:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      # Shallow checkout; the base commit needed for the diff is fetched
      # explicitly below instead of cloning the repo's full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Detect whether any non-doc/CODEOWNERS source files changed.
      # Implemented with plain git instead of a third-party paths-filter
      # action, since Apache's GitHub Actions allowlist forbids actions that
      # aren't GitHub-created or explicitly permitted.
      - id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # On the very first push to a branch, github.event.before is all-zeros.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            echo "No usable base SHA; treating as source change."
            exit 0
          fi
          # Diff from the merge-base (fork point) so only this PR/push's own
          # commits count. For pull_request events BASE_SHA is the current base
          # branch tip, which drifts ahead of the fork point as the base branch
          # advances; diffing from the merge-base isolates the PR's real changes
          # (e.g. keeps a docs-only PR classified as docs-only).
          #
          # GitHub's compare API uses 3-dot semantics, so .merge_base_commit.sha
          # is the fork point. gh is pre-installed on the runner.
          MERGE_BASE=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" \
            --jq '.merge_base_commit.sha' 2>/dev/null || true)
          if [ -z "$MERGE_BASE" ]; then
            # API unavailable/unexpected: fail safe toward building.
            echo "source=true" >> "$GITHUB_OUTPUT"
            echo "Could not resolve merge-base via API; treating as source change."
            exit 0
          fi
          echo "Merge-base: $MERGE_BASE"
          # The shallow checkout has HEAD but may lack the merge-base commit;
          # fetch just that one commit so the local diff can read its tree.
          git cat-file -e "$MERGE_BASE^{commit}" 2>/dev/null \
            || git fetch --depth=1 origin "$MERGE_BASE" 2>/dev/null || true
          # MERGE_BASE is an ancestor of HEAD, so this diff yields the PR/push's
          # own changes.
          if ! changed=$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA" 2>/dev/null); then
            echo "source=true" >> "$GITHUB_OUTPUT"
            echo "git diff against merge-base failed; treating as source change."
            exit 0
          fi
          echo "Changed files:"
          echo "$changed"
          # Drop paths that should NOT count as source changes; if anything
          # survives, real source changed.
          source=$(echo "$changed" | grep -vE \
            -e '^AUTHORS$' \
            -e '^CONTRIBUTING\.md$' \
            -e '(^|/)CODEOWNERS$' \
            -e '^Documentation/' \
            -e '^tools/ci/docker/linux/' \
            -e '^tools/codeowners/[^/]+$' \
            || true)
          if [ -n "$source" ]; then
            echo "source=true" >> "$GITHUB_OUTPUT"
          else
            echo "source=false" >> "$GITHUB_OUTPUT"
          fi

  load-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: set-matrix
        run: echo "matrix=$(jq -c '.' .github/membrowse-targets.json)" >> $GITHUB_OUTPUT

  # Post an "identical" MemBrowse report when only docs/CODEOWNERS changed.
  # Only runs on push events (master/releases/tags) to keep the baseline
  # complete; PR events don't produce identical markers.
  identical:
    needs: [changes-filter, load-targets]
    if: needs.changes-filter.outputs.source == 'false' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install membrowse
        run: pip install --no-cache-dir membrowse
      - name: Upload identical - ${{ matrix.target_name }}
        env:
          MEMBROWSE_API_KEY: ${{ secrets.MEMBROWSE_API_KEY }}
          MEMBROWSE_API_URL: ${{ vars.MEMBROWSE_API_URL }}
          TARGET_NAME: ${{ matrix.target_name }}
          # Base on the previous branch tip, not the (often unreported mid-PR)
          # git parent.
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          ARGS=(--upload --github
                --target-name "$TARGET_NAME"
                --api-key "$MEMBROWSE_API_KEY"
                --identical)
          if [ -n "$MEMBROWSE_API_URL" ]; then
            ARGS+=(--api-url "$MEMBROWSE_API_URL")
          fi
          # Override parent with previous tip; skip on branch creation (0s).
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            ARGS+=(--base-sha "$BEFORE_SHA")
          fi
          membrowse report "${ARGS[@]}"

  # Build target with debug symbols + linker map, then upload MemBrowse report.
  # Uses the NuttX CI Docker image so toolchains, kconfig-frontends, etc. are
  # already installed.
  analyze:
    needs: [changes-filter, load-targets]
    if: needs.changes-filter.outputs.source == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-targets.outputs.matrix) }}
    steps:
      - name: Checkout nuttx repo
        uses: actions/checkout@v7
        with:
          path: sources/nuttx
          fetch-depth: 2

      - name: Checkout nuttx-apps repo
        uses: actions/checkout@v7
        with:
          # STAGING: mirror repo, and a current apps mirror branch instead of
          # the intentionally stale zhn-test default branch.
          repository: zhn-test/nuttx-apps
          ref: membrowse-apps-base-20260824
          path: sources/apps
          fetch-depth: 1

      # Free space before pulling the large NuttX CI image; ubuntu-latest ships
      # only ~14 GB free on / and the image otherwise fails to unpack with
      # "no space left on device". Mirrors the cleanup in .github/workflows/build.yml.
      - name: Show Disk Space
        run: df -h

      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/local/lib/android

      - name: After CLEAN-UP Disk Space
        run: df -h

      # Measure what the pull request declares. The checkouts above give this
      # pull request merged into master, plus the nuttx-apps default branch,
      # and nothing else: a companion or predecessor pull request it depends on
      # is absent. For a breaking change the target then does not build at all,
      # and no report is produced.
      #
      # Both repositories are applied, as in build.yml. A stacked nuttx
      # dependency is no more optional than an apps one -- a pull request that
      # uses an API its predecessor introduces does not build without it.
      #
      # The report is filed under the pull request head SHA rather than the SHA
      # of the tree that was built, so the measurement cannot be reproduced
      # from that SHA alone and cannot be split per dependency. That is a limit
      # on provenance, not on the measurement: the combined result is what the
      # declaration asks for. The step summary names the full source set.
      #
      # This runs after the disk cleanup above because applying a dependency
      # deepens a checkout, and the runner has little room to spare before the
      # CI image is pulled.
      #
      # A declared dependency that cannot be applied fails the job. build.yml
      # fails Fetch-Source on the same conditions, and no other step here has
      # continue-on-error, so a silent fallback would be the odd one out. It
      # would also upload a measurement taken from sources that are not the
      # declared combination.
      - name: Apply depends-on PRs
        # STAGING: master-equivalent base branch and mirror allow-list.
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'membrowse-base-20260824' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUTTX_REPO: zhn-test/nuttx
          APPS_REPO: zhn-test/nuttx-apps
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # The event payload holds the description from when the run was
          # created, so re-read it: a manual re-run after editing a Depends-On
          # line must apply the current declaration, as it does in build.yml.
          #
          # Unlike build.yml, which resolves this once and shares one tree with
          # every target, this step runs on each target's own runner. Falling
          # back to the payload here could leave some targets on the current
          # declaration and others on the one the run was created with, while
          # the results are all filed under a single SHA, so stop instead.
          if ! PR_BODY="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""')"; then
            echo "::error::Could not read the PR description."
            exit 1
          fi

          # The parser and its output are a contract, not a hint: a missing
          # parser, a crash, or a status this step does not know about all mean
          # the declaration was never evaluated. Continuing would measure a
          # combination nobody asked for, so stop instead.
          PARSER=sources/nuttx/.github/scripts/depends_on.py
          if [ ! -f "$PARSER" ]; then
            echo "::error::${PARSER} not found."
            exit 1
          fi

          STATE="${RUNNER_TEMP:-/tmp}/depends-on-state.txt"
          if ! python3 "$PARSER" --print-state > "$STATE"; then
            echo "::error::Could not parse the depends-on declarations."
            exit 1
          fi

          # --print-state prints only the state. The parser also drops entries
          # it cannot use -- an unsupported repository, say -- and says so in
          # its warnings, which build.yml surfaces but this would otherwise
          # swallow, leaving the summary below silent about a declared entry
          # that was never applied. Blank the output variables so this second
          # call, on the same body, only prints those warnings.
          if ! WARNINGS="$(GITHUB_OUTPUT= REPORT_PATH= python3 "$PARSER" --github-output)"; then
            echo "::error::Could not re-read the depends-on warnings."
            exit 1
          fi
          printf '%s\n' "$WARNINGS" | grep '^::warning::' || true

          STATUS=$(head -n 1 "$STATE")
          case "$STATUS" in
            ok) ;;
            none)
              echo "No Depends-On declaration; building against the default sources."
              exit 0 ;;
            invalid)
              # The parser's own warning, forwarded above, already says this
              # and names the expected form; do not annotate it twice.
              echo "No valid dependency parsed; building against the default sources."
              exit 0 ;;
            *)
              echo "::error::Unexpected depends-on parser status: ${STATUS}"
              exit 1 ;;
          esac

          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"

          # Read from a file so the loop is not a subshell and the declaration
          # order recorded by --print-state is preserved. The write is checked
          # rather than left to the shell, so an unreadable list cannot skip the
          # loop and build against sources the declaration was never applied to.
          # A status of ok with no reference means the output format moved
          # underneath this step; an empty loop would quietly report the
          # default sources as though the declaration had been honoured.
          if ! tail -n +2 "$STATE" > "${STATE}.refs" || [ ! -s "${STATE}.refs" ]; then
            echo "::error::Could not read the parsed dependency list."
            exit 1
          fi
          # The upload is filed under the pull request head SHA, so the tree it
          # was taken from cannot be reconstructed from that SHA alone. Name
          # the whole source set where the report is read, not only in the log.
          {
            echo "### Depends-On source set"
            echo
            echo "Measured under this pull request's head SHA, together with:"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          while read -r DEP; do
            [ -n "$DEP" ] || continue
            DEP_REPO=${DEP%/pull/*}
            DEP_NUM=${DEP##*/}

            # Same mapping as build.yml, so that the memory report measures the
            # source set Build tests rather than a subset of it.
            # STAGING: mirror repo names.
            case "$DEP_REPO" in
              "zhn-test/nuttx")       REPO_PATH=sources/nuttx ;;
              "zhn-test/nuttx-apps")  REPO_PATH=sources/apps ;;
              *)
                echo "::error::Unsupported dependency repository: ${DEP_REPO}"
                exit 1 ;;
            esac

            echo "Applying dependency ${DEP}"
            # Deepening can fail without the dependency being unreachable, so
            # keep going. Say it happened: the common-base check below reads
            # like an unrelated dependency when the history is just missing.
            if [ -f "${REPO_PATH}/.git/shallow" ] \
               && ! git -C "$REPO_PATH" fetch --unshallow origin; then
              echo "::warning::Could not deepen ${REPO_PATH}; a missing common base below may follow from that rather than from ${DEP}."
            fi
            if ! git -C "$REPO_PATH" fetch origin "pull/${DEP_NUM}/head:dep-${DEP_NUM}"; then
              echo "::error::Could not fetch ${DEP} (the PR may not exist)."
              exit 1
            fi

            # Unrelated histories would make HEAD..dep list every dependency
            # commit and cherry-pick unrelated changes.
            if [ -z "$(git -C "$REPO_PATH" merge-base "dep-${DEP_NUM}" HEAD || true)" ]; then
              echo "::error::Could not find a common base with ${DEP}."
              exit 1
            fi
            if ! COMMITS=$(git -C "$REPO_PATH" rev-list --reverse "HEAD..dep-${DEP_NUM}"); then
              echo "::error::Could not list the commits of ${DEP}."
              exit 1
            fi

            DEP_SHA=$(git -C "$REPO_PATH" rev-parse --short=10 "dep-${DEP_NUM}")
            if [ -z "$COMMITS" ]; then
              echo "Dependency ${DEP} is already included."
              echo "- \`${DEP}\` @ \`${DEP_SHA}\` (already in the checkout)" \
                >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              continue
            fi

            # shellcheck disable=SC2086
            if ! git -C "$REPO_PATH" cherry-pick $COMMITS; then
              echo "::error::Could not cherry-pick ${DEP}."
              echo "::error::If your pull request contains merge commits, rebase instead of merging."
              git -C "$REPO_PATH" cherry-pick --abort || true
              exit 1
            fi
            echo "Applied ${DEP} @ ${DEP_SHA}"
            echo "- \`${DEP}\` @ \`${DEP_SHA}\`" \
              >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          done < "${STATE}.refs"

      - name: Docker Login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Pull
        run: docker pull ghcr.io/apache/nuttx/apache-nuttx-ci-linux

      - name: Build ${{ matrix.target_name }}
        uses: ./sources/nuttx/.github/actions/ci-container
        with:
          run: |
            git config --global --add safe.directory /github/workspace/sources/nuttx
            git config --global --add safe.directory /github/workspace/sources/apps
            cd /github/workspace/sources/nuttx
            ./tools/configure.sh -l ${{ matrix.board_config }}
            echo CONFIG_DEBUG_SYMBOLS=y >> .config
            echo CONFIG_DEBUG_LINK_MAP=y >> .config
            if [ -n "${{ matrix.config_overrides }}" ]; then
              kconfig-tweak ${{ matrix.config_overrides }}
            fi
            make olddefconfig
            # Preserve preprocessed linker scripts (.ld.tmp) so MemBrowse can
            # read them. Arch Makefiles delete these immediately after linking.
            find arch -name Makefile -exec sed -i '/DELFILE, $(addsuffix .tmp,$(ARCHSCRIPT))/d' {} +
            make -j$(nproc)

      # MemBrowse action runs from $GITHUB_WORKSPACE and discovers git via CWD,
      # but nuttx is checked out to sources/nuttx/ (so apps can sit beside it).
      # Expose the repo's .git at the workspace root so git metadata resolves.
      - name: Expose nuttx .git to workspace root
        run: ln -sfn sources/nuttx/.git .git

      - name: Prefix linker script paths
        id: ld
        run: |
          prefixed=""
          for p in ${{ matrix.ld }}; do
            prefixed="$prefixed sources/nuttx/$p"
          done
          paths=$(echo $prefixed | xargs)
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          echo "Resolved ld paths: [$paths]"
          for p in $paths; do
            if [ -e "$p" ]; then
              echo "  OK   $p ($(stat -c '%s bytes, owner=%U:%G' "$p" 2>/dev/null))"
            else
              echo "  MISS $p"
              echo "  ls dir:"
              ls -la "$(dirname "$p")" 2>&1 | head -30
            fi
          done

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install membrowse
        run: pip install --no-cache-dir membrowse
      - name: MemBrowse analysis - ${{ matrix.target_name }}
        # STAGING: the mirror has no MEMBROWSE_API_KEY, so the upload cannot
        # succeed. The evidence for this change is the apply step and the build
        # above it, so do not fail the job on the upload.
        continue-on-error: true
        env:
          MEMBROWSE_API_KEY: ${{ secrets.MEMBROWSE_API_KEY }}
          MEMBROWSE_API_URL: ${{ vars.MEMBROWSE_API_URL }}
          TARGET_NAME: ${{ matrix.target_name }}
          ELF: sources/nuttx/${{ matrix.elf }}
          LD_PATHS: ${{ steps.ld.outputs.paths }}
          MAP_FILE: ${{ matrix.map_file != '' && format('sources/nuttx/{0}', matrix.map_file) || '' }}
          LINKER_VARS: ${{ matrix.linker_vars }}
          # Push only: base on the previous branch tip, not the (often
          # unreported mid-PR) git parent. Empty on PRs (--github bases on the
          # PR target tip).
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -o pipefail
          ARGS=("$ELF" "$LD_PATHS"
                --upload --github
                --target-name "$TARGET_NAME"
                --api-key "$MEMBROWSE_API_KEY")
          if [ -n "$MEMBROWSE_API_URL" ]; then
            ARGS+=(--api-url "$MEMBROWSE_API_URL")
          fi
          # Override parent with previous tip; skip on branch creation (0s).
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            ARGS+=(--base-sha "$BEFORE_SHA")
          fi
          if [ -n "$MAP_FILE" ]; then
            ARGS+=(--map-file "$MAP_FILE")
          fi
          if [ -n "$LINKER_VARS" ]; then
            set -f
            for var in $LINKER_VARS; do
              ARGS+=(--def "$var")
            done
            set +f
          fi
          membrowse --verbose INFO report "${ARGS[@]}"
